version: '3.8'

services:
  chatdesk:
    build:
      context: .
      dockerfile: Dockerfile
    # image: chatdesk:latest
    ports:
      - "8888:8888"
    environment:
      - DOOTASK_URL="http://nginx"
      - DOOTASK_WEBHOOK=http://nginx/api/dialog/msg/sendtext
      - DOOTASK_VERSION="1.0.0"
    volumes:
      - ./docker/logs:/root/logs
    restart: unless-stopped
    networks:
      - chatdesk-network

networks:
  chatdesk-network:
    driver: bridge